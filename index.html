<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pixel Canvas — Restored Clean Build (v6)</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div id="topbar" class="topbar">
    <label class="chk"><input type="checkbox" id="toggle-grid" checked> Show grid lines</label>
    <label class="chk"><input type="checkbox" id="toggle-nums" checked> Show quadrant numbers</label>
    <span id="cooldown-msg" class="hidden">Cooling down…</span>
  </div>

  <div id="panel" class="panel">
    <h3>Auth & Chat</h3>
    <div class="row">
      <button id="login-twitch">Twitch Login</button>
      <span id="status-twitch" class="status">No token</span>
    </div>
    <div class="row">
      <button id="login-kick">Kick Login</button>
      <span id="status-kick" class="status">No token</span>
    </div>
    <div class="row">
      <button id="login-youtube">YouTube Login</button>
      <span id="status-youtube" class="status">No token</span>
    </div>
    <div class="row">
      <label class="mono" for="chat-platform">Active platform:</label>
      <select id="chat-platform" title="Choose a logged-in platform to send commands">
        <option value="twitch">Twitch</option>
        <option value="kick">Kick</option>
        <option value="youtube">YouTube</option>
      </select>
    </div>
    <div class="row">
      <div id="test-user" class="user-badge" title="Logged-in username">Not logged in</div>
    </div>
    <div class="row">
      <input id="chat-msg" placeholder="!co 700 200 red  (column row color; commas optional)"/>
      <button id="chat-send">Send</button>
    </div>
    <p class="hint">Login with a token, select a platform, and enter a viewer username. Cooldowns apply <strong>per user, per platform</strong> for 120 seconds.</p>
  </div>

  <canvas id="pixelCanvas" aria-label="Pixel canvas"></canvas>

  <div id="popup" class="popup hidden" role="dialog" aria-modal="true">
    <div class="popup-header">
      <strong>Color!</strong>
      <button id="popup-close" title="Close">×</button>
    </div>
    <div id="pixel-info" class="mono">Quadrant: – | Column: –, Row: –</div>
<div class="row">
  <label for="color-select" class="mono">Palette:</label>
  <select id="color-select">
    <!-- Rainbow-first, then off colors, then gray/black/white -->
    <option style="background:#FF0000;color:#fff;" value="#FF0000">Red</option>
    <option style="background:#FFA500;color:#000;" value="#FFA500">Orange</option>
    <option style="background:#FFFF00;color:#000;" value="#FFFF00">Yellow</option>
    <option style="background:#00FF00;color:#000;" value="#00FF00">Lime</option>
    <option style="background:#008000;color:#fff;" value="#008000">Green</option>
    <option style="background:#FFC0CB;color:#000;" value="#FFC0CB">Pink</option>
    <option style="background:#00FFFF;color:#000;" value="#00FFFF">Cyan</option>
    <option style="background:#87CEEB;color:#000;" value="#87CEEB">Sky Blue</option>
    <option style="background:#0000FF;color:#fff;" value="#0000FF">Blue</option>
    <option style="background:#4B0082;color:#fff;" value="#4B0082">Indigo</option>
    <option style="background:#8A2BE2;color:#fff;" value="#8A2BE2">Violet</option>
    <option style="background:#FF00FF;color:#fff;" value="#FF00FF">Magenta</option>
    <option style="background:#8B4513;color:#fff;" value="#8B4513">Brown</option>
    <option style="background:#D2B48C;color:#000;" value="#D2B48C">Tan</option>
    <option style="background:#FFD700;color:#000;" value="#FFD700">Gold</option>
    <option style="background:#808080;color:#fff;" value="#808080">Gray</option>
    <option style="background:#000000;color:#fff;" value="#000000">Black</option>
    <option style="background:#FFFFFF;color:#000;" value="#FFFFFF">White</option>
  </select>
  <button id="color-btn">Apply</button>
</div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
